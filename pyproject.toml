[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dianstar"
version = "0.1.0"
description = "DianStar local command-line agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.58,<4",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "certifi>=2024.2.2",
    "rich>=14.2,<16",
    "markdown-it-py>=3,<5",
    "textual>=8.2,<9",
    "mcp>=1.29,<2",
    "jsonschema>=4.23,<5",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
dianstar = "dianstar.__main__:main"
ds = "dianstar.__main__:main"

[tool.setuptools.packages.find]
include = ["dianstar*"]

[tool.setuptools.package-data]
dianstar = ["prompts/system.md", "assets/rabbit.json", "assets/rabbit-source.png", "assets/kapok.json", "assets/kapok-source.png", "assets/copy_menu.ps1"]
